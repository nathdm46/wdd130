<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dallin H. Oaks | Prophet Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px;
      background-color: #FFECD7;
      display: grid;
      place-items: center;
      font-family: Helvetica, Arial, sans-serif;
    }
    .card {
      width: 370px;
      max-width: 100%;
      padding: 22px 25px 30px;
      border: 4px solid #004E63;
      border-radius: 26px;
      background-color: #008DB1;
      text-align: center;
    }
    h1 {
      margin: 0 0 5px;
      color: #FFFFFF;
      font-size: 40px;
    }
    .subtitle {
      margin: 0 0 18px;
      line-height: 1.3;
      font-size: 17px;
    }
    .subtitle a {
      color: #91E4FB;
      text-decoration: none;
    }
    .portrait {
      display: block;
      width: 258px;
      height: 258px;
      max-width: 100%;
      margin: 0 auto;
      border: 4px solid white;
      object-fit: cover;
    }
    ul {
      width: max-content;
      max-width: 100%;
      margin: 10px auto 17px;
      padding-left: 22px;
      color: #FFFFFF;
      font-size: 19px;
      line-height: 1.4;
      text-align: left;
    }
    blockquote {
      margin: 0;
      color: #FFD783;
      font-family: "Brush Script MT", "Apple Chancery", cursive;
      font-size: 20px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Dallin H. Oaks</h1>
    <p class="subtitle">
      <a href="https://www.churchofjesuschrist.org/" target="_blank" rel="noopener noreferrer">
        18th President of the Church of Jesus Christ of Latter-day Saints
      </a>
    </p>
    <img class="portrait" src="https://andejuli.github.io/wdd130-new/ice/prophet_cards/images/dallin_oaks.jpg" alt="Portrait of Dallin H. Oaks">
    <ul>
      <li>Born: Aug 12, 1932</li>
      <li>Apostle: Apr 7, 1984</li>
      <li>Prophet: Oct 14, 2025</li>
    </ul>
    <blockquote>
      “The gospel of Jesus Christ teaches us that our highest priority is to love God and to love our fellowmen.”
    </blockquote>
  </main>
</body>
</html>
