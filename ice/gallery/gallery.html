<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images of Christ</title>
    <style>
        body {
            background: black;
        }
        #wrapper{
            max-width: 800px;
            margin: 0 auto;
        }
        nav {
            color: white;
            text-align: center;
            font-family: Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        #gallery{
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            box-sizing: border-box;
            border: 15px solid rgb(255, 255, 255);
            width: 100%;
            background-color: #ddd;
            background-image:
                linear-gradient(45deg, #ccc 26%, transparent 26%), 
                linear-gradient(135deg, #ccc 26%, transparent 26%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(135deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px; /* Must be a square */
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px; 
            
        }
        #gallery a {
            cursor: url('images/christus.png'), pointer;
        }
        #gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            opacity: 85%;
            display:block;
        }
        #gallery img:hover{
            opacity: 100%;
        }
        #gallery a:focus-visible { outline: 4px solid gold; outline-offset: -4px; }
        #gallery a:focus-visible img { opacity: 100%; }
        @media (max-width: 650px) { #gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } #gallery img { height: 240px; } }
        @media (max-width: 360px) { #gallery { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="wrapper">
        <nav>
            <h1>Christ Art Gallery</h1>
        </nav>
        <main>
            <div id="gallery">
                <a href="images/big/img1.jpg"><img src="images/small/img1.jpg" alt="Artwork of Jesus Christ, image 1" loading="lazy" decoding="async"></a>
                <a href="images/big/img2.jpg"><img src="images/small/img2.jpg" alt="Artwork of Jesus Christ, image 2" loading="lazy" decoding="async"></a>
                <a href="images/big/img3.jpg"><img src="images/small/img3.jpg" alt="Artwork of Jesus Christ, image 3" loading="lazy" decoding="async"></a>
                <a href="images/big/img4.jpg"><img src="images/small/img4.jpg" alt="Artwork of Jesus Christ, image 4" loading="lazy" decoding="async"></a>
                <a href="images/big/img5.jpg"><img src="images/small/img5.jpg" alt="Artwork of Jesus Christ, image 5" loading="lazy" decoding="async"></a>
                <a href="images/big/img6.jpg"><img src="images/small/img6.jpg" alt="Artwork of Jesus Christ, image 6" loading="lazy" decoding="async"></a>
                <a href="images/big/img7.jpg"><img src="images/small/img7.jpg" alt="Artwork of Jesus Christ, image 7" loading="lazy" decoding="async"></a>
                <a href="images/big/img8.jpg"><img src="images/small/img8.jpg" alt="Artwork of Jesus Christ, image 8" loading="lazy" decoding="async"></a>
                <a href="images/big/img9.jpg"><img src="images/small/img9.jpg" alt="Artwork of Jesus Christ, image 9" loading="lazy" decoding="async"></a>
                <a href="images/big/img10.jpg"><img src="images/small/img10.jpg" alt="Artwork of Jesus Christ, image 10" loading="lazy" decoding="async"></a>
                <a href="images/big/img11.jpg"><img src="images/small/img11.jpg" alt="Artwork of Jesus Christ, image 11" loading="lazy" decoding="async"></a>
                <a href="images/big/img12.jpg"><img src="images/small/img12.jpg" alt="Artwork of Jesus Christ, image 12" loading="lazy" decoding="async"></a>
            </div>
        </main>
    </div>
</body>
</html>
